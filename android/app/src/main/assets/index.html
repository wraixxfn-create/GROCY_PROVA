<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185341">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: https://it.openfoodfacts.org https://world.openfoodfacts.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Grocy Locale · Dispensa semplice</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="model.js" defer></script>
<script src="barcode.js" defer></script>
<script src="recognize.js" defer></script>
<script src="openfoodfacts.js" defer></script>
<script src="ocr.js" defer></script>
<script src="app.js" defer></script>
<script src="product-scan.js" defer></script>
</head>
<body>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="#pantry" aria-label="Grocy Locale">
      <span class="brand-mark" data-icon="leaf"></span>
      <span class="brand-text">grocy <small>LOCALE</small></span>
    </a>
    <nav class="top-tabs" aria-label="Sezioni principali"></nav>
    <div class="header-actions">
      <button class="btn primary header-add" data-action="scan-two" type="button">
        <span data-icon="camera"></span>
        <span>Aggiungi (2 foto)</span>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <button class="fab" data-action="scan-two" type="button" aria-label="Aggiungi prodotto con 2 foto">
    <span data-icon="camera"></span>
    <span>Aggiungi prodotto</span>
  </button>

  <nav class="bottom-nav" aria-label="Navigazione"></nav>
</div>

<dialog id="modal" aria-labelledby="modal-title">
  <div id="modal-content"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="scan2-file" accept="image/*" hidden>
</body>
</html>
